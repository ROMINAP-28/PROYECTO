name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x mvnw
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./mvnw -B clean test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco

  security:
    name: Security Gate (SCA & DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 1. SCA: OWASP Dependency-Check (falla en CVSS >= 9)
      - name: Run OWASP Dependency-Check (SCA)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            echo "[INFO] Usando NVD_API_KEY desde secretos del repositorio."
            EXTRA_ARGS="-DnvdApiKey=$NVD_API_KEY"
          else
            echo "[AVISO] NVD_API_KEY no configurado; ejecutando con rate limit público."
          fi
          ./mvnw -B org.owasp:dependency-check-maven:10.0.4:check \
            -Dformat=ALL \
            -DoutputDirectory=target/dependency-check \
            -DfailBuildOnCVSS=9 \
            -DskipTestCompile=true \
            -DossindexAnalyzerEnabled=false \
            $EXTRA_ARGS

      - name: Upload Dependency-Check Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check/

      # 2. DAST: ZAP Baseline contra contenedor Docker local con seed sintético
      - name: Generate Ephemeral Database Password
        run: |
          echo "CI_DB_PASSWORD=$(openssl rand -base64 18)" >> $GITHUB_ENV

      - name: Provision Synthetic Local Environment
        run: |
          cat << EOF > .env
          DB_USERNAME=root
          DB_PASSWORD=${{ env.CI_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ env.CI_DB_PASSWORD }}
          MYSQL_DATABASE=DBTravelink
          EOF
          chmod +x mvnw
          docker compose up -d --build
          echo "[INFO] Esperando estado saludable de app y db..."
          for i in $(seq 1 40); do
            if docker compose ps | grep -E "travelink-app.*\(healthy\)"; then
              echo "[OK] Aplicación saludable y lista para escaneo con seed sintético (schema, mínimos y seed cargados)."
              break
            fi
            echo "Esperando arranque ($i/40)..."
            sleep 3
          done

      - name: Run OWASP ZAP Baseline Scan (DAST)
        continue-on-error: true
        run: |
          # zap-baseline.py con -I ignora advertencias, pero reporta codigo != 0 ante hallazgos Medium/High
          # continue-on-error registra el estado en el step y delega la validacion estricta al siguiente paso
          docker run --rm \
            --network travelink-net \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable:latest \
            zap-baseline.py -t http://app:8080 -r zap-report.html -J zap-report.json -I

      - name: Verify ZAP Findings (Fail on High/Critical)
        run: |
          if [ -f zap-report.json ]; then
            # Parseo robusto de alerts con riskcode == "3" (Riesgo Alto/Critico)
            HIGH_ALERTS=$(jq '[.site[].alerts[]? | select(.riskcode=="3")] | length' zap-report.json 2>/dev/null || echo "0")
            echo "Alertas de riesgo ALTO encontradas: $HIGH_ALERTS"
            if [ "$HIGH_ALERTS" -gt 0 ]; then
              echo "[SECURITY GATE FAILED] ZAP detectó $HIGH_ALERTS alertas de riesgo ALTO (High)."
              exit 1
            else
              echo "[SECURITY GATE PASSED] ZAP no encontró alertas de riesgo ALTO."
            fi
          else
            echo "[ERROR] zap-report.json no fue generado por ZAP."
            exit 1
          fi

      - name: Upload ZAP Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-reports
          path: |
            zap-report.html
            zap-report.json

      - name: Cleanup Docker Environment
        if: always()
        run: |
          docker compose down -v || true
          rm -f .env
