name: Mantenimiento Semanal y Auditoría de Seguridad

on:
  schedule:
    # Ejecución automática todos los lunes a las 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions UI

permissions:
  contents: read
  security-events: write

jobs:
  auditoria-mantenimiento:
    name: Escaneo SCA Trivy y Dependencias Desactualizadas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Generar Reporte de Dependencias Desactualizadas (Versions Plugin)
        run: |
          mkdir -p target/mantenimiento-reportes
          ./mvnw -B versions:display-dependency-updates versions:display-plugin-updates | tee target/mantenimiento-reportes/dependencias-actualizaciones.txt

      - name: Generar Árbol de Dependencias
        run: |
          ./mvnw -B dependency:tree -DoutputFile=target/mantenimiento-reportes/arbol-dependencias.txt

      - name: Escaneo de Vulnerabilidades SCA con Aqua Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'target/mantenimiento-reportes/trivy-reporte-mantenimiento.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Subir Reportes de Mantenimiento como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-mantenimiento-semanal
          path: target/mantenimiento-reportes/
          retention-days: 30
