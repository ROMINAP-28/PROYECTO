# ==========================================================
# TRAVELINK - CONFIGURACIÓN DE SPRING BOOT 3
# ==========================================================
server.port=8080

# ----------------------------------------------------------
# Conexión a Base de Datos (Aiven MySQL)
# Credenciales desacopladas por variables de entorno
# ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-traveling-traveling.k.aivencloud.com:19936/DBTravelink?useSSL=true&trustServerCertificate=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:AVNS_GohPsfjQ1YmM-IL7AoH}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de Conexiones HikariCP
spring.datasource.hikari.pool-name=TravelinkHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

# ----------------------------------------------------------
# Spring Data JPA / Hibernate
# El esquema lo maneja SQL externo, ddl-auto=none siempre
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ----------------------------------------------------------
# Servidor Web, Compresión y Archivos Estáticos
# ----------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.static-locations=classpath:/static/,file:./Springboot/resources/static/,file:./backend/resources/static/

# ----------------------------------------------------------
# Forzar Codificación UTF-8 en Tomcat / Servlets
# ----------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.servlet.encoding.enabled=true

# ----------------------------------------------------------
# Configuración de Sesión y Cookies (HttpOnly, SameSite=Lax)
# ----------------------------------------------------------
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

