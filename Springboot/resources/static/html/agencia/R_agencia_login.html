<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../js/comun/config.js"></script>
    <script src="../../js/comun/api.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelink - Login Agencia</title>
    <link rel="stylesheet" href="../../css/agencia/agencia.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="agencia-page">

<main class="login-layout">

    <section class="login-image">
        <div class="login-overlay">
            <span class="brand-light">Travelink</span>
            <h1>Conecta tu agencia con nuevos viajeros.</h1>
            <p>Administra tus servicios y experiencias desde Travelink.</p>
        </div>
    </section>

    <section class="login-card">

        <div class="form-header">
            <span class="step-label">Portal de agencias</span>
            <h2>Iniciar sesión</h2>
            <p>Accede a la administración de tu agencia.</p>
        </div>

        <form id="formLoginAgencia">

            <div class="form-group">
                <label for="loginUsuario">Correo o usuario</label>
                <input
                        type="text"
                        id="loginUsuario" placeholder="Correo o nombre de usuario" pattern="^[A-Za-z0-9@\._-]+$" title="Ingresa un usuario o correo válido (sin espacios)" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">contraseña</label>
                <div class="password-field">
                    <input
                            type="password"
                            id="loginPassword"
                            placeholder="contraseña"
                            required>

                    <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword">
                        👁
                    </button>
                </div>
            </div>

            <p id="mensajeLogin" class="form-message"></p>

            <button type="submit" class="btn-primary">
                Iniciar sesión
            </button>

        </form>

        <a href="#" class="forgot-password">
            ¿Olvidaste tu contraseña?
        </a>

        <p class="auth-footer">
            ¿No tienes una cuenta?
            <a href="R_agencia_registro.html">Regístrate</a>
        </p>

        <div style="margin-top: 16px; padding-top: 14px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 13px; color: #64748b; display: flex; justify-content: center; align-items: center; gap: 14px;">
            <a href="../../index.html" style="color: #196f3d; text-decoration: none; font-weight: 600;">Inicio</a>
            <span>•</span>
            <a href="../turista/login.html" style="color: #475569; text-decoration: none; font-weight: 600;">Soy Turista</a>
            <span>•</span>
            <a href="../administrador/login.html" style="color: #d97706; text-decoration: none; font-weight: 600;">Acceso Admin</a>
        </div>

    </section>

</main>

<script src="../../js/agencia/agencia.js"></script>
</body>
</html>
