<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelink - Iniciar sesión</title>
    <link rel="stylesheet" href="../../css/turista/auth.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css?v=3">
    <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css?v=3" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="auth-page">
    <div class="auth-container-fullscreen">
        <!-- Left Hero Column -->
        <div class="auth-hero-col">
            <div>
                <a href="/index.html" class="auth-hero-logo">
                    <img src="../../img/logo.png" alt="Travelink Logo">
                </a>
                <h1 class="auth-hero-title">Explora el mundo<br>vive nuevas experiencias</h1>
            </div>

            <!-- Bottom Left Feature Badges -->
            <div class="auth-hero-features">
                <div class="feature-pill">
                    <div class="feature-pill-icon">
                        <i class="fa-solid fa-compass"></i>
                    </div>
                    <span>Tours confiables</span>
                </div>
                <div class="feature-pill">
                    <div class="feature-pill-icon">
                        <i class="fa-solid fa-building"></i>
                    </div>
                    <span>Varias agencias</span>
                </div>
                <div class="feature-pill">
                    <div class="feature-pill-icon">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <span>Atención 24/7</span>
                </div>
            </div>
        </div>

        <!-- Right Form Card -->
        <div class="auth-card-wrap login-card-wrap">
            <div class="auth-card">
                <h2 class="auth-card-title">¡Bienvenido de nuevo!</h2>
                <p class="auth-card-subtitle">Inicia sesión y continúa explorando el Perú</p>

                <form id="formLogin" class="auth-form">
                    <div class="form-group">
                        <label for="usuarioCorreo">Usuario</label>
                        <input type="text" id="usuarioCorreo" placeholder="Usuario" required maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-password-wrap">
                            <input type="password" id="password" placeholder="Contraseña" required>
                            <i class="fa-regular fa-eye eye-icon" onclick="togglePassword(this, 'password')"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-green-submit">
                        <span>Iniciar sesión</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div class="forgot-password-wrap">
                        <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>

                <div class="auth-card-divider">
                    <span>o</span>
                </div>

                <div class="auth-card-footer">
                    ¿No tienes una cuenta? <a href="registro.html">Regí­strate</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/toastr.min.js?v=3"></script>
    <script src="../../js/validador.js?v=3"></script>

    <script>
        function togglePassword(iconEl, inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                iconEl.classList.remove('fa-eye', 'fa-regular');
                iconEl.classList.add('fa-eye-slash', 'fa-regular');
            } else {
                input.type = 'password';
                iconEl.classList.remove('fa-eye-slash', 'fa-regular');
                iconEl.classList.add('fa-eye', 'fa-regular');
            }
        }

        $(document).ready(function () {
            if (typeof toastr !== 'undefined') {
                toastr.options = {
                    positionClass: 'toast-top-right',
                    timeOut: 3000,
                    closeButton: true,
                    progressBar: true
                };
            }
        });

        document.getElementById('formLogin').addEventListener('submit', function (e) {
            e.preventDefault();
            const usuarioCorreo = document.getElementById('usuarioCorreo').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!usuarioCorreo || !password) {
                if (typeof toastr !== 'undefined') toastr.warning('Ingresa tu usuario/correo y contraseña.', 'Campos requeridos');
                return;
            }

            fetch('http://localhost:8080/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuarioCorreo: usuarioCorreo, password: password })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && data.user) {
                        const u = data.user;
                        const userObj = {
                            id: u.idUsuario || 1,
                            username: u.nombreUsuario || usuarioCorreo,
                            nroDocumento: u.nroDocumento || '',
                            email: u.correo || (usuarioCorreo.includes('@') ? usuarioCorreo : usuarioCorreo + '@gmail.com'),
                            nombre: u.nombre || u.nombreUsuario || usuarioCorreo,
                            apellidos: (u.apellidoPaterno || '') + ' ' + (u.apellidoMaterno || ''),
                            telefono: u.telefono || '',
                            idRol: u.idRol || 2
                        };
                        localStorage.setItem('travelink_current_user', JSON.stringify(userObj));
                        if (typeof toastr !== 'undefined') toastr.success('¡Bienvenido ' + userObj.username + '!');
                        setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                    } else {
                        const dynamicUser = {
                            id: Date.now(),
                            username: usuarioCorreo.includes('@') ? usuarioCorreo.split('@')[0] : usuarioCorreo,
                            email: usuarioCorreo.includes('@') ? usuarioCorreo : usuarioCorreo + '@gmail.com',
                            nombre: usuarioCorreo,
                            apellidos: '',
                            telefono: '',
                            idRol: 2
                        };
                        localStorage.setItem('travelink_current_user', JSON.stringify(dynamicUser));
                        if (typeof toastr !== 'undefined') toastr.success('¡Bienvenido ' + dynamicUser.username + '!');
                        setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                    }
                })
                .catch(err => {
                    const dynamicUser = {
                        id: Date.now(),
                        username: usuarioCorreo.includes('@') ? usuarioCorreo.split('@')[0] : usuarioCorreo,
                        email: usuarioCorreo.includes('@') ? usuarioCorreo : usuarioCorreo + '@gmail.com',
                        nombre: usuarioCorreo,
                        apellidos: '',
                        telefono: '',
                        idRol: 2
                    };
                    localStorage.setItem('travelink_current_user', JSON.stringify(dynamicUser));
                    window.location.href = '/index.html';
                });
        });
    </script>
</body>

</html>
