services:
  db:
    image: mysql:8.0
    container_name: travelink-db-prod
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DBTravelink}
    # Publicado para depuración e inspección con DBeaver (IPv4 e IPv6)
    ports:
      - "3307:3306"
    expose:
      - "3306"
    volumes:
      - travelink_prod_mysql_data:/var/lib/mysql
      - ../../sql/travelink_schema.sql:/docker-entrypoint-initdb.d/01-travelink_schema.sql:ro
      - ../../sql/datos_minimos.sql:/docker-entrypoint-initdb.d/02-datos_minimos.sql:ro
      - ../../sql/seed_pruebas.sql:/docker-entrypoint-initdb.d/03-seed_pruebas.sql:ro
    networks:
      - travelink-prod-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 10s
      retries: 25
      start_period: 30s

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: travelink-app:latest
    container_name: travelink-app-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Puerto 8080 NO publicado al host; solo accesible internamente por el proxy Nginx
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:+UseContainerSupport
        -Xlog:gc*:file=/app/logs/gc.log:time,uptime:filecount=5,filesize=10M
        -Dspring.profiles.active=prod
        -Dfile.encoding=UTF-8
    volumes:
      - travelink_prod_logs:/app/logs
    networks:
      - travelink-prod-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 300s

  nginx:
    image: nginx:alpine
    container_name: travelink-nginx-prod
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../servidor/nginx/travelink.conf:/etc/nginx/conf.d/default.conf:ro
      - ../servidor/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - travelink-prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --no-check-certificate https://127.0.0.1/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  travelink_prod_mysql_data:
    name: travelink_prod_mysql_data
  travelink_prod_logs:
    name: travelink_prod_logs

networks:
  travelink-prod-net:
    name: travelink-prod-net
    driver: bridge
