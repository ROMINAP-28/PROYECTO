# ==============================================================================
# CONFIGURACIÓN NGINX PROXY REVERSO CON TLS Y HARDENING — TRAVELINK
# Ubicación en servidor: /etc/nginx/conf.d/travelink.conf
# ==============================================================================

# 1. Redirección forzada de HTTP (80) hacia HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost travelink.com www.travelink.com;

    # Desafío Let's Encrypt ACME para renovación de certificados reales
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost travelink.com www.travelink.com;

    # Certificados TLS (Autofirmado local o Let's Encrypt en producción)
    ssl_certificate /etc/nginx/ssl/travelink.crt;
    ssl_certificate_key /etc/nginx/ssl/travelink.key;

    # Protocolos y Ciphers Modernos Seguros (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Compresión Gzip perimetral
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeceras de Seguridad Perimetral (Hardening OWASP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self';" always;

    # Restricción CORS perimetral (Elimina el wildcard '*')
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|travelink\.com)(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-XSRF-TOKEN" always;

    # Seguridad en Cookies (añadir Secure y SameSite=Lax a cookies emitidas por el backend)
    proxy_cookie_flags ~ secure samesite=lax;

    # 3. Protección de Paneles y Endpoints Administrativos (Restricción por IP / Red Interna)
    location ~* ^/(html/administrador|api/admin) {
        # Permitir loopback local y redes privadas (Docker bridge / VPN corporativa)
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Proxy inverso hacia el backend Spring Boot
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 5. Monitoreo Spring Boot Actuator (Protección perimetral estricta)
    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Bloqueo estricto de cualquier otro endpoint de Actuator (prometheus, metrics, env, etc.)
    location /actuator/ {
        return 403 "Forbidden: Endpoint de administracion restringido.\n";
    }
}
