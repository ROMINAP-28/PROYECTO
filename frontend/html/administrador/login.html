<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelink - Iniciar sesión Admin</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: url('../../img/fondologoadmin.png') no-repeat center center / cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15%;
            color: #0f172a;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px -5px rgba(10, 31, 51, 0.12), 0 10px 15px -5px rgba(0, 0, 0, 0.04);
            padding: 38px 42px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .shield-icon-wrapper {
            width: 32px;
            height: 32px;
            background: #1a73e8;
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .security-text {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background: #16a34a;
            border-radius: 50%;
            display: inline-block;
        }

        .login-title {
            font-size: 27px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 17px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 11px 40px 11px 42px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .form-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
        }

        .toggle-password-btn {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .toggle-password-btn:hover {
            color: #475569;
        }

        /* Ocultar el botón nativo de Edge y Chrome para evitar doble ícono de ojo */
        input::-ms-reveal,
        input::-ms-clear {
            display: none !important;
        }

        input::-webkit-contacts-auto-fill-button,
        input::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            display: none !important;
            pointer-events: none;
        }

        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #334155;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        .remember-checkbox input[type="checkbox"] {
            accent-color: #1a73e8;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .forgot-link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 600;
            transition: underline 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login-submit {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
        }

        .btn-login-submit:hover {
            background: #1557b0;
        }

        .btn-login-submit:active {
            transform: scale(0.99);
        }

        .footer-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
        }

        .footer-divider::before,
        .footer-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .footer-divider span {
            padding: 0 12px;
        }

        @media (max-width: 900px) {
            body {
                justify-content: center;
                padding-right: 20px;
                padding-left: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Badge Superior -->
        <div class="security-badge">
            <div class="shield-icon-wrapper">
                <i class="ti ti-shield-lock"></i>
            </div>
            <span class="security-text">
                <span class="green-dot"></span> Sesión segura
            </span>
        </div>

        <!-- Encabezado -->
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Acceso al panel administrativo</p>

        <!-- Formulario -->
        <form id="formAdminLogin" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label class="form-label" for="adminUsuario">Usuario</label>
                <div class="input-wrapper">
                    <i class="ti ti-user input-icon-left"></i>
                    <input type="text" id="adminUsuario" class="form-input" placeholder="admin" required
                        autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="adminPassword">Contraseña</label>
                <div class="input-wrapper">
                    <i class="ti ti-lock input-icon-left"></i>
                    <input type="text" id="adminPassword" class="form-input" placeholder="Ingresa tu contraseña"
                        required autocomplete="current-password">
                    <i class="ti ti-eye toggle-password-btn" id="togglePasswordIcon"
                        onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <div class="options-row">
                <label class="remember-checkbox">
                    <input type="checkbox" id="checkRemember" checked>
                    <span>Recordarme</span>
                </label>
                <a href="javascript:void(0)"
                    onclick="Swal.fire('Recuperar acceso', 'Contacta al soporte técnico institucional en soporte@travelink.pe', 'info')"
                    class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login-submit" id="btnSubmitAdmin">
                <span>Iniciar sesión</span>
                <i class="ti ti-arrow-right"></i>
            </button>
        </form>

        <div class="footer-divider">
            <span>Acceso exclusivo para administradores</span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('adminPassword');
            const icon = document.getElementById('togglePasswordIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'ti ti-eye-off toggle-password-btn';
            } else {
                passInput.type = 'password';
                icon.className = 'ti ti-eye toggle-password-btn';
            }
        }

        function getApiUrl(endpoint) {
            const host = (window.location.protocol === 'file:' || (window.location.port && window.location.port !== '8080')) 
                ? 'http://localhost:8080' 
                : '';
            return host + endpoint;
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmitAdmin');
            const usuario = document.getElementById('adminUsuario').value.trim();
            const password = document.getElementById('adminPassword').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> Verificando...';

            try {
                let response;
                try {
                    response = await fetch(getApiUrl('/api/login'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuarioCorreo: usuario, password: password })
                    });
                } catch (fetchErr) {
                    // Si falló la primera URL, intentar explícitamente a http://localhost:8080/api/login
                    response = await fetch('http://localhost:8080/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuarioCorreo: usuario, password: password })
                    });
                }

                const data = await response.json();

                if (data.status === 'success' && data.user) {
                    if (data.user.idRol === 3 || data.user.idRol === '3') {
                        localStorage.setItem('admin_user', JSON.stringify(data.user));
                        localStorage.setItem('travelink_user', JSON.stringify(data.user));
                        localStorage.setItem('travelink_current_user', JSON.stringify(data.user));

                        Swal.fire({
                            icon: 'success',
                            title: '¡Acceso Concedido!',
                            text: 'Bienvenido al panel administrativo de Travelink, ' + (data.user.nombre || 'Administrador'),
                            timer: 1100,
                            showConfirmButton: false
                        }).then(() => {
                            window.location.href = 'index.html';
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Acceso Restringido',
                            text: 'Esta cuenta no posee permisos de Administrador.'
                        });
                        btn.disabled = false;
                        btn.innerHTML = '<span>Iniciar sesión</span> <i class="ti ti-arrow-right"></i>';
                    }
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de autenticación',
                        text: data.message || 'Credenciales no válidas.'
                    });
                    btn.disabled = false;
                    btn.innerHTML = '<span>Iniciar sesión</span> <i class="ti ti-arrow-right"></i>';
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: 'No se pudo conectar con el servidor backend en http://localhost:8080.'
                });
                btn.disabled = false;
                btn.innerHTML = '<span>Iniciar sesión</span> <i class="ti ti-arrow-right"></i>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const admin = localStorage.getItem('admin_user');
            if (admin) {
                try {
                    const u = JSON.parse(admin);
                    if (u.idRol === 3 || u.idRol === '3') {
                        window.location.href = 'index.html';
                    }
                } catch (e) { }
            }
        });
    </script>
</body>

</html>
