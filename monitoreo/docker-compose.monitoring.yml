services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: travelink-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - travelink_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - travelink-monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  grafana:
    image: grafana/grafana:10.4.1
    container_name: travelink-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminTravelink2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - travelink_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - travelink-monitoring-net
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  loki:
    image: grafana/loki:2.9.6
    container_name: travelink-loki
    user: "0:0"
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - travelink_loki_data:/tmp/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - travelink-monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  promtail:
    image: grafana/promtail:2.9.6
    container_name: travelink-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../logs:/var/log/travelink:ro
    networks:
      - travelink-monitoring-net
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: travelink-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - travelink-monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: travelink-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - travelink-monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  zipkin:
    image: openzipkin/zipkin:3.1.1
    container_name: travelink-zipkin
    restart: unless-stopped
    environment:
      - STORAGE_TYPE=mem
    ports:
      - "127.0.0.1:9411:9411"
    networks:
      - travelink-monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

networks:
  travelink-monitoring-net:
    driver: bridge

volumes:
  travelink_prometheus_data:
  travelink_grafana_data:
  travelink_loki_data:
