server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: travelink-application-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: travelink
          app: travelink-app
          env: production
          __path__: /var/log/travelink/*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?P<thread>[^\]]+)\] \[(traceId=(?P<traceId>[^ ]*) spanId=(?P<spanId>[^\]]*))?\] (?P<level>[A-Z]+)\s+(?P<logger>[^ ]+) - (?P<message>.*)$'
      - labels:
          level:
          traceId:
          spanId:

  - job_name: travelink-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: travelink-json
          app: travelink-app
          __path__: /var/log/travelink/*-json.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            traceId: traceId
            spanId: spanId
            message: message
      - labels:
          level:
          traceId:
          spanId:
